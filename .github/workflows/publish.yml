name: publish

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: false
        type: string
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Install specific Bun version
        run: |
          curl -fsSL https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip  -o /tmp/bun.zip
          unzip /tmp/bun.zip -d /tmp
          mv /tmp/bun-linux-x64/bun /usr/local/bin/bun
          chmod +x /usr/local/bin/bun

      - name: Check bun version
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine Version
        id: get_version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(bun -e 'console.log(require("./packages/cli/package.json").version)')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Build (x64 only)
        env:
          OPENCODE_VERSION: ${{ steps.get_version.outputs.version }}
          OPENCODE_CHANNEL: "latest"
        run: |
          cd packages/cli
          echo "Building OpenCode with version: $OPENCODE_VERSION"
          bun run script/build.ts --single --skip-install

      - name: List build output
        run: ls -la packages/cli/dist/

      - name: Create tarball
        run: |
          cd packages/cli/dist
          tar -czf opencode-linux-x64.tar.gz opencode-linux-x64

      - name: Upload to Release
        if: inputs.version != '' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          draft: false
          files: |
            packages/cli/dist/opencode-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
